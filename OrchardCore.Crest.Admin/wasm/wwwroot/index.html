<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crest</title>
    <base href="/" />
    <link id="crest-radzen-theme" rel="stylesheet" href="/_content/OrchardCore.Crest.Components/css/material-base.css" />
    <link rel="stylesheet" href="/OrchardCore.Resources/Vendor/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/OrchardCore.Resources/Vendor/fontawesome-free/css/v4-shims.min.css" />
    <link rel="stylesheet" href="/OrchardCore.Resources/Vendor/fontawesome-free/css/v5-font-face.min.css" />
    <!-- Crest-owned assets are base-relative, not root-absolute: they resolve against
         the <base href> BlazorAdminThemeMiddleware rewrites to the tenant's real
         AdminPath/LoginPath, so every request for them arrives *under* that prefix and
         is unambiguously the admin shell's. Root "/_framework/*" belongs to
         Crest.Server's Blazor Web App host (Site) - both apps ship identically-named
         framework files (dotnet.js and friends), and .NET 10 embeds the boot config
         (assembly list, entry point) inside dotnet.js, so sharing that URL space boots
         the wrong app. Only per-package-namespaced host assets (/_content/*,
         /OrchardCore.Resources/*) stay root-absolute - those can never collide. -->
    <link rel="stylesheet" href="CrestAdmin.DesignSystem.Default.css" />
    <link rel="stylesheet" href="CrestComponents.css" />
    <link rel="stylesheet" href="OrchardCore.Crest.Components.styles.css" />
    <link rel="stylesheet" href="CrestAdmin.css" />
    <link rel="stylesheet" href="OrchardCore.Crest.Admin.styles.css" />
    <link rel="stylesheet" href="CrestIcons.css" />
</head>
<body>
    <div id="app">Loading...</div>
    <script src="crest.theme.js"></script>
    <script src="crest.components.js"></script>
    <script src="crest.adminMenus.js"></script>
    <script src="icons.js"></script>
    <script src="/_content/OrchardCore.Crest.Components/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
